<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextbike Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="assets/css/app.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-slate-50 font-sans antialiased text-slate-800">

    <header class="w-full bg-white border-b border-slate-200 shadow-sm flex z-20">
        <button onclick="toggleSettingsMenu()" class="flex-1 py-4 border-r border-slate-200 hover:bg-slate-50 font-bold text-lg flex items-center justify-center space-x-2 text-slate-700">
            <span>⚙️</span> <span>Settings</span>
        </button>
        <button id="auth-tab" onclick="openLoginModal()" class="flex-1 py-4 hover:bg-slate-50 font-bold text-lg flex items-center justify-center space-x-2 text-slate-700">
            <span>👤</span> <span id="auth-tab-text">Login</span>
        </button>
    </header>

    <main class="flex-1 relative flex flex-col w-full overflow-hidden">
        
        <div id="map" class="flex-1 w-full z-0" style="min-height:0"></div>

        <div id="settings-menu" class="hidden absolute top-4 left-4 w-80 bg-white/95 backdrop-blur-md p-5 rounded-xl shadow-xl border border-slate-200 z-10 space-y-4">
            <h3 class="font-bold text-sm text-slate-700 uppercase tracking-wider">Karten-Filter</h3>
            
            <button id="locateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition">
                📍 Meinen Standort anzeigen
            </button>

            <hr class="border-slate-200">

            <div>
                <div class="flex justify-between text-xs font-medium text-slate-500 mb-1">
                    <label for="radiusSlider">Suchradius</label>
                    <span><span id="radiusValue">500</span> m</span>
                </div>
                <input id="radiusSlider" type="range" min="100" max="3000" step="100" value="500" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
            </div>

            <div class="flex items-center justify-between">
                <label for="citySelect" class="text-xs font-medium text-slate-500">Stadt:</label>
                <select id="citySelect" class="border border-slate-300 rounded px-2 py-1 text-xs">
                    <option value="1170" selected>Bonn</option>
                </select>
            </div>

            <div class="flex items-center justify-between py-1">
                <label for="electricCheckbox" class="text-xs font-medium text-slate-500">Nur E-Bikes anzeigen</label>
                <input id="electricCheckbox" type="checkbox" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
            </div>

            <hr class="border-slate-200">

            <div class="grid grid-cols-2 gap-2">
                <button id="loadBikesBtn" class="bg-slate-800 hover:bg-black text-white text-xs font-bold py-2 px-1 rounded transition">Räder laden</button>
                <button id="favoriteBikesBtn" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2 px-1 rounded transition">⭐ Favoriten</button>
            </div>
            <button id="clearRouteBtn" class="w-full bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold py-2 rounded transition">Route abbrechen</button>
        </div>

        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-full max-w-xs px-4">
            <button id="nearestBikeBtn" class="w-full bg-white hover:bg-slate-50 text-slate-800 font-black border-4 border-black py-3 px-6 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition transform active:translate-x-1 active:translate-y-1 active:shadow-none text-center text-lg uppercase tracking-tight">
                Find my Nextbike!
            </button>
        </div>

        <div id="login-modal" class="hidden absolute inset-0 bg-black/40 flex items-center justify-center z-30 p-4">
            <div class="bg-white border-4 border-black p-6 w-full max-w-sm shadow-2xl relative">
                <button onclick="closeLoginModal()" class="absolute top-2 right-3 text-xl font-bold text-slate-500 hover:text-black">✕</button>
                <h3 class="text-xl font-black text-center mb-4 uppercase tracking-tight">Anmeldung</h3>
                <div class="space-y-4">
                    <div>
                        <input type="text" id="username-input" class="w-full border-2 border-black px-3 py-2 font-mono text-sm focus:outline-none" placeholder="Username">
                    </div>
                    <div>
                        <input type="password" id="password-input" class="w-full border-2 border-black px-3 py-2 font-mono text-sm focus:outline-none" placeholder="Passwort">
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button onclick="handleLogin()" class="bg-black hover:bg-slate-800 text-white font-bold py-2 text-sm uppercase">Login</button>
                        <button onclick="openRegisterModal()" class="border-2 border-black hover:bg-slate-100 font-bold py-2 text-sm uppercase">Register</button>
                    </div>
                    <button onclick="handleForgotPassword()" class="w-full text-xs font-semibold text-slate-600 hover:text-black underline underline-offset-2 pt-1">
                        Passwort vergessen?
                    </button>
                </div>
            </div>
        </div>

        <div id="register-modal" class="hidden absolute inset-0 bg-black/40 flex items-center justify-center z-30 p-4">
            <div class="bg-white border-4 border-black p-6 w-full max-w-sm shadow-2xl relative">
                <button onclick="closeRegisterModal()" class="absolute top-2 right-3 text-xl font-bold text-slate-500 hover:text-black">✕</button>
                <h3 class="text-xl font-black text-center mb-4 uppercase tracking-tight">Registrierung</h3>
                <div class="space-y-4">
                    <div>
                        <input type="text" id="register-username-input" class="w-full border-2 border-black px-3 py-2 font-mono text-sm focus:outline-none" placeholder="Username">
                        <small class="text-slate-500 text-xs mt-1 block">3-32 Zeichen. Nur: a-z A-Z 0-9 _ - .</small>
                    </div>
                    <div>
                        <input type="email" id="register-email-input" class="w-full border-2 border-black px-3 py-2 font-mono text-sm focus:outline-none" placeholder="E-Mail">
                        <small class="text-slate-500 text-xs mt-1 block">z.B.: test@example.com</small>
                    </div>
                    <div>
                        <input type="password" id="register-password-input" class="w-full border-2 border-black px-3 py-2 font-mono text-sm focus:outline-none" placeholder="Passwort">
                        <small class="text-slate-500 text-xs mt-1 block">Min. 8 Zeichen</small>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button onclick="handleRegister()" class="bg-black hover:bg-slate-800 text-white font-bold py-2 text-sm uppercase">Konto erstellen</button>
                        <button onclick="openLoginModal()" class="border-2 border-black hover:bg-slate-100 font-bold py-2 text-sm uppercase">Zurück</button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <script src="js/map.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
